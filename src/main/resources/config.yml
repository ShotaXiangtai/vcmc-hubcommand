# vcmc-hubcommand config
# velocity.toml のサーバー名と一致させてください
lobby-server: lobby

messages:
  # ロビーに既にいる場合のメッセージ (&a などのカラーコード使用可)
  already-in-lobby: "&eYou are already in the lobby!"
  # ロビーへ接続中のメッセージ
  connecting: "&aConnecting to lobby..."

# コマンド使用に必要なパーミッション (空白 = 全員使用可)
permission: ""

# /hubblock に必要なパーミッション (コンソールからは常に実行できます)
admin-permission: "vcmc.hubcommand.admin"

# /hub, /lobby, /l をプロキシで処理しないサーバー一覧（ブラックリスト）
# ここに登録したサーバーにいる間、これらのコマンドはそのままバックエンドへ転送されます
# (バックエンドに同名のコマンドがあればそれが実行され、なければ不明なコマンドとして扱われます)
# velocity.toml で定義したサーバー名を指定してください。/hubblock でも変更できます
blocked-servers: []
